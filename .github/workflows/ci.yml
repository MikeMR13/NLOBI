name: NLOBI CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Password recovery and session regression
        run: node scripts/auth-recovery-check.mjs
      - name: Restore team owner and platform administrator regression
        run: node scripts/auth-permissions-check.mjs
      - name: Linked works Studio and PostgREST FK regression
        run: node scripts/account-work-catalog-check.mjs
      - name: Studio phase 1 regression
        run: node scripts/studio-phase1-check.mjs
      - name: Studio phase 2 regression
        run: node scripts/studio-phase2-check.mjs
      - name: Studio phase 3 regression
        run: node scripts/studio-phase3-check.mjs
      - name: Studio phase 4 regression
        run: node scripts/studio-phase4-check.mjs
      - name: Studio phase 5 regression
        run: node scripts/studio-phase5-check.mjs
      - name: Studio phase 6 regression
        run: node scripts/studio-phase6-check.mjs
      - name: Studio phase 7 regression
        run: node scripts/studio-phase7-check.mjs
      - name: Studio editorial workflow regression
        run: node scripts/studio-status-workflow-check.mjs
      - name: Studio original and translation status filters regression
        run: node scripts/studio-dual-status-check.mjs
      - name: Performance routing, caching and SQL regression
        run: node scripts/performance-regression-check.mjs
      - run: npm run build
      - name: Build fingerprint and lazy asset regression
        run: node scripts/lazy-performance-check.mjs
      - name: PWA cache regression
        run: node scripts/pwa-cache-check.mjs
      - name: Start preview server
        run: |
          npx --yes serve@14.2.4 dist -l 4173 > /tmp/nlobi-serve.log 2>&1 &
          echo $! > /tmp/nlobi-serve.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nlobi-serve.log
          exit 1
      - name: Install accessibility test browser
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 @axe-core/playwright@4.13.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Browser: Studio is lazy on public routes
        run: node scripts/lazy-studio-browser-check.mjs
      - name: Mobile Lighthouse performance report
        id: lighthouse
        continue-on-error: true
        run: |
          mkdir -p performance-results
          npx --yes lighthouse@12 http://127.0.0.1:4173/#home --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --form-factor=mobile --screenEmulation.mobile=true --throttling-method=simulate --only-categories=performance,accessibility --output=json --output-path=performance-results/mobile-home.json --quiet
          node -e "const r=require('./performance-results/mobile-home.json');const a=r.audits;const m={performance:Math.round(100*r.categories.performance.score),accessibility:Math.round(100*r.categories.accessibility.score),LCP:a['largest-contentful-paint']?.numericValue,CLS:a['cumulative-layout-shift']?.numericValue,TBT:a['total-blocking-time']?.numericValue};console.log('Lighthouse mobile:',JSON.stringify(m));require('node:fs').writeFileSync('performance-results/summary.json',JSON.stringify(m,null,2))"
          node scripts/lcp-diagnostics.mjs
      - name: axe accessibility audit
        id: axe
        continue-on-error: true
        run: node scripts/axe-check.mjs
      - name: Enforce accessibility before lengthy visual and quality suite
        if: steps.axe.outcome == 'failure'
        run: exit 1
      - name: Home phase 4 responsive editorial matrix (Chromium + WebKit)
        run: node scripts/home-editorial-phase4-check.mjs
      - name: Global literary visual system phase 1 — Home, Explore and Library (Chromium + WebKit)
        run: node scripts/global-literary-phase1-check.mjs
      - name: Global literary visual phase 2 — profiles, teams, notifications and community (Chromium + WebKit)
        run: node scripts/global-literary-phase2-check.mjs
      - name: Global literary visual phase 3 — Studio and administration (Chromium + WebKit)
        run: node scripts/global-literary-phase3-check.mjs
      - name: Global literary visual phase 4 — configurable reader presentation (Chromium + WebKit)
        run: node scripts/global-literary-phase4-reader-check.mjs
      - name: Detail editorial phase 1 responsive and interaction regression
        run: node scripts/detail-editorial-phase1-check.mjs
      - name: Detail editorial phase 2 volume gallery regression (Chromium + WebKit)
        run: node scripts/detail-editorial-phase2-check.mjs
      - name: Detail editorial phase 3 chapter index and navigation regression (Chromium + WebKit)
        run: node scripts/detail-editorial-phase3-check.mjs
      - name: Detail editorial phase 4 book motion, paper and accessibility regression (Chromium + WebKit)
        run: node scripts/detail-editorial-phase4-check.mjs
      - name: Featured cover size and motion regression (Chromium + WebKit)
        run: node scripts/home-featured-balance-check.mjs
      - name: Mobile interaction audit (Chromium + WebKit)
        run: node scripts/mobile-interactions-check.mjs
      - name: Studio account and works visual browser audit
        run: node scripts/studio-visual-browser-audit.mjs
      - name: Notification bell technical and responsive regression
        run: node scripts/notification-bell-check.mjs
      - name: Studio final volume checkbox and layout visual regression
        run: node scripts/studio-final-volume-visual-check.mjs
      - name: Optional editorial statuses and public visibility regression
        run: node scripts/studio-optional-status-check.mjs
      - name: Visual layout audit
        run: node scripts/layout-check.mjs
      - name: Site appearance contrast audit (six palettes)
        run: node scripts/appearance-contrast-check.mjs
      - name: Visual cohesion phase 3 audit
        run: node scripts/visual-unification-phase3-check.mjs
      - name: Home phase 2 editorial shelf and mobile regression
        run: node scripts/home-editorial-phase2-check.mjs
      - name: Home phase 3 immersive motion and accessibility regression
        run: node scripts/home-editorial-phase3-check.mjs
      - name: Appearance visual regression phase 4 matrix
        run: node scripts/visual-regression-phase4-check.mjs
      - name: Mobile navigation phase 2 interaction audit
        run: node scripts/mobile-navigation-phase2-check.mjs
      - name: Explore visual and interaction audit
        run: node scripts/explore-quality-check.mjs
      - name: Full platform quality pass
        id: full_quality
        continue-on-error: true
        run: node scripts/full-quality-check.mjs
      - name: Cross-browser smoke
        run: node scripts/cross-browser-check.mjs
      - name: Upload performance report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: lighthouse-mobile-report
          path: performance-results/
          if-no-files-found: warn
      - name: Upload full quality report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: full-platform-quality-report
          path: quality-results/
          if-no-files-found: error
      - name: Upload phase 4 visual regression snapshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: visual-regression-phase4-report
          path: |
            visual-results/phase4-appearance-matrix.json
            visual-results/phase4-snapshots/
            visual-results/home-phase4/
            visual-results/home-featured/
          if-no-files-found: warn
      - name: Upload visual layout report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: visual-layout-report
          path: visual-results/
          if-no-files-found: error
      - name: Upload axe report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: axe-accessibility-report
          path: axe-results/
          if-no-files-found: error
      - name: Enforce axe result
        if: steps.axe.outcome == 'failure'
        run: exit 1

      - name: Enforce full-platform quality result
        if: steps.full_quality.outcome == 'failure'
        run: exit 1
